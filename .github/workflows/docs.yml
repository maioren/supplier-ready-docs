name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs*.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt
      - name: Build Portuguese docs
        run: mkdocs build --strict -f mkdocs.pt-BR.yml
      - name: Build English docs
        run: mkdocs build --strict -f mkdocs.en.yml
      - name: Build Spanish docs
        run: mkdocs build --strict -f mkdocs.es.yml
      - name: Create default language redirect
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./pt-BR/">
              <link rel="canonical" href="./pt-BR/">
              <title>Supplier Ready</title>
            </head>
            <body>
              <p><a href="./pt-BR/">Continuar em Português (Brasil)</a></p>
            </body>
          </html>
          EOF
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
