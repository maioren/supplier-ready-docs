INHERIT: mkdocs.yml
site_description: Understand buyer requirements. Know what is missing. Get Ready.
site_dir: site/en
docs_dir: docs/en

theme:
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  alternate:
    - name: Português (Brasil)
      link: https://maioren.github.io/supplier-ready-docs/pt-BR/
      lang: pt-BR
    - name: English
      link: https://maioren.github.io/supplier-ready-docs/en/
      lang: en
    - name: Español
      link: https://maioren.github.io/supplier-ready-docs/es/
      lang: es

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Your first analysis: getting-started/first-analysis.md
  - Concepts:
      - Overview: concepts/index.md
      - Buyer requirements: concepts/buyer-requirements.md
      - Requirement interpretation: concepts/requirement-interpretation.md
      - Readiness: concepts/readiness.md
  - Guides:
      - Overview: guides/index.md
  - Reference:
      - Overview: reference/index.md
  - Product:
      - What we're building: product/roadmap.md
