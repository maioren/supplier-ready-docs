INHERIT: mkdocs.yml
site_description: Understand customer requirements. Know what's missing. Be Ready.
site_dir: site/en
docs_dir: docs/en

theme:
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  alternate:
    - name: Português (Brasil)
      link: https://maioren.github.io/supplier-ready-docs/pt-BR/
      lang: pt-BR
    - name: English
      link: https://maioren.github.io/supplier-ready-docs/en/
      lang: en
    - name: Español
      link: https://maioren.github.io/supplier-ready-docs/es/
      lang: es

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Your first analysis: getting-started/first-analysis.md
  - Concepts:
      - Overview: concepts/index.md
      - Customer requirements: concepts/buyer-requirements.md
      - Requirement interpretation: concepts/requirement-interpretation.md
      - Traceability and evidence: concepts/traceability-evidence.md
      - Readiness: concepts/readiness.md
  - Guides:
      - Overview: guides/index.md
      - Create an analysis: guides/create-analysis.md
      - Review interpreted requirements: guides/review-interpreted-requirements.md
      - Resolve clarifications: guides/resolve-clarifications.md
      - Assess a requirement: guides/assess-requirement.md
      - Understand and resolve gaps: guides/resolve-gaps.md
      - Track Readiness: guides/track-readiness.md
  - Reference:
      - Overview: reference/index.md
      - States and enums: reference/states-enums.md
      - Requirement model: reference/requirement-model.md
      - Readiness: reference/readiness.md
      - API v0: reference/api-v0.md
      - Errors: reference/errors.md
  - Product:
      - What we're building: product/roadmap.md
