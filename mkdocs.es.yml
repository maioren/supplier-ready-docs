INHERIT: mkdocs.yml
site_description: Entienda las exigencias de su cliente. Sepa qué falta. Esté Ready.
site_dir: site/es
docs_dir: docs/es

theme:
  language: es
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  alternate:
    - name: Português (Brasil)
      link: https://maioren.github.io/supplier-ready-docs/pt-BR/
      lang: pt-BR
    - name: English
      link: https://maioren.github.io/supplier-ready-docs/en/
      lang: en
    - name: Español
      link: https://maioren.github.io/supplier-ready-docs/es/
      lang: es

nav:
  - Inicio: index.md
  - Primeros pasos:
      - Visión general: getting-started/index.md
      - Su primer análisis: getting-started/first-analysis.md
  - Conceptos:
      - Visión general: concepts/index.md
      - Exigencias del cliente: concepts/buyer-requirements.md
      - Interpretación de requisitos: concepts/requirement-interpretation.md
      - Trazabilidad y evidencias: concepts/traceability-evidence.md
      - Readiness: concepts/readiness.md
  - Guías:
      - Visión general: guides/index.md
      - Crear un análisis: guides/create-analysis.md
      - Revisar requisitos interpretados: guides/review-interpreted-requirements.md
      - Resolver aclaraciones: guides/resolve-clarifications.md
      - Evaluar un requisito: guides/assess-requirement.md
      - Entender y resolver gaps: guides/resolve-gaps.md
      - Acompañar Readiness: guides/track-readiness.md
  - Referencia:
      - Visión general: reference/index.md
      - Estados y enums: reference/states-enums.md
      - Modelo de requisito: reference/requirement-model.md
      - Readiness: reference/readiness.md
      - API v0: reference/api-v0.md
      - Errores: reference/errors.md
  - Producto:
      - Lo que estamos construyendo: product/roadmap.md
