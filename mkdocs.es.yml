INHERIT: mkdocs.yml
site_description: Entienda los requisitos del comprador. Sepa qué falta. Esté Ready.
site_dir: site/es
docs_dir: docs/es

theme:
  language: es
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Cambiar al modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar al modo claro

extra:
  alternate:
    - name: Português (Brasil)
      link: https://maioren.github.io/supplier-ready-docs/pt-BR/
      lang: pt-BR
    - name: English
      link: https://maioren.github.io/supplier-ready-docs/en/
      lang: en
    - name: Español
      link: https://maioren.github.io/supplier-ready-docs/es/
      lang: es

nav:
  - Inicio: index.md
  - Primeros pasos:
      - Visión general: getting-started/index.md
      - Su primer análisis: getting-started/first-analysis.md
  - Conceptos:
      - Visión general: concepts/index.md
      - Requisitos del comprador: concepts/buyer-requirements.md
      - Interpretación de requisitos: concepts/requirement-interpretation.md
      - Readiness: concepts/readiness.md
  - Guías:
      - Visión general: guides/index.md
  - Referencia:
      - Visión general: reference/index.md
  - Producto:
      - Lo que estamos construyendo: product/roadmap.md
